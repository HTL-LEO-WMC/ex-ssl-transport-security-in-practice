services:

  # The reverse proxy. It is the only container that speaks TLS.
  traefik:
    image: "traefik:v3.7"
    container_name: "traefik"
    command:
      - "--api.insecure=true"                          # dashboard on :8080, never do this in production
      - "--providers.docker=true"                      # read routes from container labels
      - "--providers.docker.exposedbydefault=false"
      - "--providers.file.directory=/etc/traefik/dynamic"
      - "--entryPoints.web.address=:80"
      - "--entryPoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8090:8080"                                    # dashboard - 8090, so Quarkus keeps 8080
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./dynamic:/etc/traefik/dynamic:ro"
      - "../tls:/certs:ro"                             # our own certificate from step 3

  # The service behind the proxy. It has no certificate and no TLS at all.
  whoami:
    image: "traefik/whoami"
    container_name: "whoami"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.whoami.rule=Host(`localhost`)"
      - "traefik.http.routers.whoami.entrypoints=websecure"
      - "traefik.http.routers.whoami.tls=true"
