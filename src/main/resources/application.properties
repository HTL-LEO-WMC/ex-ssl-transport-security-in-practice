# TLS registry - the default configuration is picked up by the HTTP server
quarkus.tls.key-store.p12.path=tls/server-keystore.p12
quarkus.tls.key-store.p12.password=changeit

# Plain HTTP is answered with a redirect to HTTPS instead of the content
quarkus.http.insecure-requests=redirect

# The generated test calls plain HTTP - without this it follows the redirect into
# HTTPS and fails with the very PKIX error we meet in step 4.
%test.quarkus.http.insecure-requests=enabled
